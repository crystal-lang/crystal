name: macOS CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  SPEC_SPLIT_DOTS: 160
  TZ: America/New_York

jobs:
  darwin-test:
    runs-on: ${{ matrix.runs-on }}
    name: "${{ matrix.runs-on }} (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
        - runs-on: macos-26-intel
          arch: x86_64-darwin
        - runs-on: macos-26
          arch: aarch64-darwin
    steps:
      - name: Download Crystal source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: crystal-lang-ci
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - run: scripts/ci-nix-init.sh

      - name: Test
        run: scripts/ci-build.sh
        shell: nix-shell --pure --run {0}

      - name: Test interpreter
        run: make interpreter_spec
        shell: nix-shell --pure --run {0}

  test-std:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        opts:
          - flags: "-Dwithout_mt"
          - workers: 4 # execution_context: parallel
    steps:
      - name: Download Crystal source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: crystal-lang-ci
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - run: scripts/ci-nix-init.sh

      - name: Test
        run: make std_spec threads=1 FLAGS="${{ matrix.opts.flags || '' }}"
        shell: nix-shell --pure --run "bash {0}"
        env:
          CRYSTAL_WORKERS: ${{ matrix.opts.workers || 1 }}
