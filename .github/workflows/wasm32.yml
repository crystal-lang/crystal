name: WebAssembly CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  SPEC_SPLIT_DOTS: "160"

jobs:
  build-compiler:
    runs-on: ubuntu-26.04
    steps:
      - name: "Download Crystal source"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Install Crystal"
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22.2"

      - name: "Install LLVM 24"
        run: |
          curl -sL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository -y deb http://apt.llvm.org/resolute/ llvm-toolchain-resolute main
          sudo apt-get install -qy llvm-24-dev

      # TODO: can't link statically because libLLVM depends on libz3.a (not distributed by libz3-dev)
      - name: "Build Crystal with LLVM 24"
        run: make crystal LLVM_CONFIG=llvm-config-24

      - uses: actions/upload-artifact@v7
        with:
          name: compiler
          path: .build/crystal
          retention-days: 1

  test-std:
    needs:
      - build-compiler
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-wasip1
          - wasm32-wasip2
          - wasm32-wasip3
    runs-on: ubuntu-26.04
    steps:
      - name: "Download Crystal source"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Install WASI SDK"
        uses: bytecodealliance/setup-wasi-sdk-action@77d09f3df1e8da344d8403cf8631af8977938b4c # v1.0.0
        id: wasi-sdk
        with:
          version: 34.0

      - name: "Build PCRE2"
        run: |
          mkdir -p /tmp/pcre2
          curl -sL "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.gz" | tar -C /tmp/pcre2 -xzf - --strip-components=1
          cd /tmp/pcre2
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DPCRE2_STATIC_PIC=ON \
            -DPCRE2_SUPPORT_JIT=OFF \
            -DPCRE2_BUILD_PCRE2GREP=OFF \
            -DPCRE2_BUILD_TESTS=OFF
          cmake --build build --parallel
        env:
          CFLAGS: "--target=${{ matrix.target }}"

      - name: "Install wasmtime"
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: 50.0.0

      # TODO: not needed if compiler was statically linked (or uses runner LLVM)
      - name: "Install LLVM 24"
        run: |
          curl -sL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository -y deb http://apt.llvm.org/resolute/ llvm-toolchain-resolute main
          sudo apt-get install -qy llvm-24-dev

      - uses: actions/download-artifact@v8
        with:
          name: compiler
          path: .build/
      - run: chmod +x .build/crystal

      - name: "Build spec/wasm32_std_spec.cr"
        run: |
          bin/crystal build spec/wasm32_std_spec.cr -o wasm32_std_spec.wasm --target ${{ matrix.target }} --link-flags="-z stack-size=8388608" -Dwithout_iconv -Dwithout_openssl -Dwithout_zlib -Dwithout_mt
        env:
          CRYSTAL_LIBRARY_PATH: "${{ steps.wasi-sdk.outputs.sysroot-path }}/lib/${{ matrix.target }}:/tmp/pcre2/build"

      - name: "Run wasm32_std_spec.wasm"
        run: |
          mkdir -p tmp
          wasmtime run --dir . --env TMPDIR=./tmp wasm32_std_spec.wasm
