name: WebAssembly CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  SPEC_SPLIT_DOTS: "160"

jobs:
  wasm32-test:
    runs-on: ubuntu-26.04
    steps:
      - name: "Download Crystal source"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Install Crystal"
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22

      - name: "Install WASI SDK"
        uses: bytecodealliance/setup-wasi-sdk-action@77d09f3df1e8da344d8403cf8631af8977938b4c # v1.0.0
        id: wasi-sdk

      - name: "Build PCRE2"
        run: |
          mkdir -p /tmp/pcre2
          curl -sL "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.gz" | tar -C /tmp/pcre2 -xzf - --strip-components=1
          cd /tmp/pcre2
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DPCRE2_STATIC_PIC=ON \
            -DPCRE2_SUPPORT_JIT=OFF \
            -DPCRE2_BUILD_PCRE2GREP=OFF \
            -DPCRE2_BUILD_TESTS=OFF
          cmake --build build --parallel
        env:
          CFLAGS: "--target=wasm32-wasip1"

      - name: "Install wasmtime"
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3

      - name: "Build spec/wasm32_std_spec.cr"
        run: |
          bin/crystal build spec/wasm32_std_spec.cr -o wasm32_std_spec.wasm --target wasm32-wasi --link-flags="-z stack-size=8388608" -Dwithout_iconv -Dwithout_openssl -Dwithout_zlib -Dwithout_mt
        env:
          CRYSTAL_LIBRARY_PATH: "${{ steps.wasi-sdk.outputs.sysroot-path }}/lib/wasm32-wasip1:/tmp/pcre2/build"

      - name: "Run wasm32_std_spec.wasm"
        run: |
          wasmtime run --dir . wasm32_std_spec.wasm
