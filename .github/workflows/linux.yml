name: Linux CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  SPEC_SPLIT_DOTS: 160

jobs:
  # Test against latest release and the earliest supported Crystal version for forward compatibility.
  #
  # A more advanced test which runs against *each* supported version is available in `forward-compatibility.yml` and
  # runs regularly on a nightly schedule.
  test:
    runs-on: ${{ case(startsWith(matrix.arch, 'aarch64'), 'ubuntu-24.04-arm', 'ubuntu-latest') }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - x86_64-musl
          - aarch64
          - aarch64-musl
        env: [{}]
        include:
          - arch: x86_64
            env:
              CRYSTAL_BOOTSTRAP_VERSION: 1.15.1
    steps:
      - name: Download Crystal source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: scripts/ci-docker-enable-ipv6.sh

      - name: Test
        run: |
          case "${{ matrix.arch }}" in
            *-musl) image_suffix=alpine-build ;;
            *) image_suffix=build ;;
          esac

          scripts/ci-docker-run.sh "$image_suffix" scripts/ci-build.sh
        env: ${{ matrix.env }}

  test-std:
    runs-on: ${{ case(startsWith(matrix.arch, 'aarch64'), 'ubuntu-24.04-arm', 'ubuntu-latest') }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64
        opts:
          - flags: "-Dwithout_mt"
          - workers: 4 # execution_context: parallel
          - flags: "-Devloop=io_uring"
            workers: 4
          - flags: "-Devloop=io_uring -Dwithout_mt"
        include:
          - arch: x86_64
            opts:
              flags: "-Devloop=libevent"
    steps:
      - name: Download Crystal source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: scripts/ci-docker-enable-ipv6.sh

      - name: Test
        run: scripts/ci-docker-run.sh 'CRYSTAL_WORKERS=${{ matrix.opts.workers || 1 }} make std_spec threads=1 FLAGS="${{ matrix.opts.flags || '' }}"'

  check_format:
    runs-on: ubuntu-latest
    steps:
      - name: Download Crystal source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Format
        run: scripts/ci-docker-run.sh 'make crystal format threads=1 check=1'
