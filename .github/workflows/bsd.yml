name: BSD CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  SPEC_SPLIT_DOTS: "160"
  TZ: "America/New_York"

jobs:
  freebsd:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: freebsd {0}
    strategy:
      matrix:
        os_release: ["14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          mem: 8192
          release: ${{ matrix.os_release }}
          disable-cache: true
          envs: SPEC_SPLIT_DOTS TZ
      - run: pkg install -y crystal git gmake pkgconf
      - run: crystal version
      - run: gmake std_spec

