name: Docs

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  deploy_api_docs:
    if: github.repository_owner == 'crystal-lang'
    runs-on: ubuntu-latest
    environment: deploy_api_docs
    steps:
      - name: Download Crystal source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build docs
        run: scripts/ci-docker-run.sh 'make crystal docs threads=1'

      - name: Set revision
        run: echo "$GITHUB_SHA" > ./docs/revision.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy API docs to S3
        run: |
          aws s3 sync ./docs s3://crystal-api/api/master --delete
