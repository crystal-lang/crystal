Lint/Typos:
  Enabled: false

# TODO: Investigate unused arguments.
Lint/UnusedArgument:
  Enabled: false

# TODO: Investigate unused block arguments.
Lint/UnusedBlockArgument:
  Enabled: false

Lint/UnusedRescueVariable:
  Excluded:
    # BUG: The exception is read after rescue or in ensure, outside the rescue body.
    - src/crystal/main.cr
    - src/crystal/once.cr

Lint/UselessAssign:
  # BUG: https://github.com/crystal-ameba/ameba/issues/447
