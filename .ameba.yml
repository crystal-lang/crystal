# This configuration file was generated by `ameba --gen-config`
# on 2025-06-02 13:57:07 UTC using Ameba version 1.7.0-dev.
# The point is for the user to remove these configuration records
# one by one as the reported problems are removed from the code base.
#
# For more details on any individual rule, run `ameba --only RuleName`.

# Indicators for comment annotations:
#
# * `Disabled`: The rule is disabled because it does not seem useful for this repo (or in general).
# * `BUG`: A bug in ameba prevents using this rule either entirely or for specific files.
# * `FIXME`: The rule seems useful, but requires some effort to resolve. That's deferred for later.
# * `TODO`: The rule might be useful, but we need to investigate whether we want to use it or not.

Version: "1.7.0"

# Lint
# =========================

# Disabled: Assignments in call arguments are intentional and idiomatic here.
Lint/AssignmentInCallArgument:
  Enabled: false

Lint/DuplicateEnumValue:
  Excluded:
    # Explicit tests and intentional aliases (including upstream C constants)
    - spec/std/enum_spec.cr
    - src/colorize.cr
    - src/compiler/crystal/command.cr
    - src/lib_c/**/*
    - src/llvm/enums.cr
    - src/openssl/lib_ssl.cr
    - src/regex/lib_pcre*.cr
    - src/syscall/aarch64-linux.cr
    - src/winerror.cr

Lint/EnumMemberNameConflict:
  Excluded:
    # Explicit tests and names from the Windows API
    - spec/std/enum_spec.cr
    - src/winerror.cr

Lint/SignalTrap:
  Excluded:
    # Implements Process.on_terminate and restores individual signal handlers
    - src/crystal/system/unix/process.cr

Lint/VoidOutsideLib:
  Excluded:
    # ABI tests and low-level Proc(Void) representations
    - spec/compiler/macro/macro_expander_spec.cr
    - src/compiler/crystal/interpreter/compiler.cr
    - src/fiber.cr
    - src/openssl/ssl/context.cr

# Disabled: Keep the macro whitespace produced by the Crystal formatter.
Lint/WhitespaceAroundMacroExpression:
  Enabled: false

Lint/DebugCalls:
  Excluded:
    # Samples may legitimately use DebugCalls
    - samples/**/*
    # Explicit tests
    - spec/std/pp_spec.cr

Lint/DebuggerStatement:
  Excluded:
    # Explicit tests
    - spec/debug/**/*

# Disabled: `else nil` can be useful to explicitly show the consequence of the else branch
Lint/ElseNil:
  Enabled: false

# Disabled: We have an explicit CI job for testing the formatter (both latest
# and head). No reason to run it through ameba.
Lint/Formatting:
  Enabled: false

Lint/LiteralInCondition:
  Excluded:
    # Samples may legitimately use literals in conditions
    - samples/**/*

Lint/LiteralInInterpolation:
  Excluded:
    - spec/std/random_spec.cr # BUG: https://github.com/crystal-ameba/ameba/issues/611

Lint/LiteralsComparison:
  Excluded:
    # Explicit tests for case equality on literals
    - spec/std/{array,char,int,number,regex,string,symbol,tuple,uint}_spec.cr

# TODO: Investigate if some `not_nil!` calls can be avoided.
Lint/NotNil:
  Enabled: false

# BUG: https://github.com/crystal-ameba/ameba/issues/605
Lint/SpecFocus:
